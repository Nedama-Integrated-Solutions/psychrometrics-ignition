# Script hints for system.psychro. Keep this file ASCII: write the degree sign as its Unicode escape.

saturationPressure.desc=Saturation vapour pressure over liquid water (over supercooled water below 0 \u00b0C).
saturationPressure.param.temperature=Temperature, \u00b0C.
saturationPressure.returns=Saturation vapour pressure, Pa.

vaporPressure.desc=Partial pressure of water vapour.
vaporPressure.param.dryBulb=Dry bulb temperature, \u00b0C.
vaporPressure.param.relHum=Relative humidity, % (0 to 100), relative to liquid water at all temperatures.
vaporPressure.returns=Vapour pressure, Pa.

vpd.desc=Vapour pressure deficit: saturation pressure minus actual vapour pressure.
vpd.param.dryBulb=Dry bulb temperature, \u00b0C.
vpd.param.relHum=Relative humidity, % (0 to 100), relative to liquid water at all temperatures.
vpd.returns=Vapour pressure deficit, Pa.

dewPoint.desc=Dew point over liquid water. Below 0 \u00b0C this is over supercooled water; use frostPoint for when frost forms.
dewPoint.param.dryBulb=Dry bulb temperature, \u00b0C.
dewPoint.param.relHum=Relative humidity, % (0 to 100), relative to liquid water at all temperatures.
dewPoint.returns=Dew point, \u00b0C.

frostPoint.desc=Dew/frost point: the frost point (over ice) when it is below 0 \u00b0C, otherwise the dew point.
frostPoint.param.dryBulb=Dry bulb temperature, \u00b0C.
frostPoint.param.relHum=Relative humidity, % (0 to 100), relative to liquid water at all temperatures.
frostPoint.returns=Dew or frost point, \u00b0C.

relHumFromDewPoint.desc=Relative humidity from dew point.
relHumFromDewPoint.param.dryBulb=Dry bulb temperature, \u00b0C.
relHumFromDewPoint.param.dewPoint=Dew point over liquid water, \u00b0C.
relHumFromDewPoint.returns=Relative humidity, %.

dewPointAtPressure.desc=Converts a dew point measured at one pressure to the dew point at another, for example atmospheric dew point to pressure dew point in compressed air. Pressures are absolute: add atmospheric pressure to a gauge reading.
dewPointAtPressure.param.dewPoint=Dew point at fromPressure, \u00b0C.
dewPointAtPressure.param.fromPressure=Absolute pressure where dewPoint applies, Pa.
dewPointAtPressure.param.toPressure=Absolute pressure where the dew point is wanted, Pa.
dewPointAtPressure.returns=Dew point at toPressure, \u00b0C.

humidityRatio.desc=Humidity ratio (moisture content).
humidityRatio.param.dryBulb=Dry bulb temperature, \u00b0C.
humidityRatio.param.relHum=Relative humidity, % (0 to 100), relative to liquid water at all temperatures.
humidityRatio.param.pressure=Absolute pressure, Pa. Use pressureFromAltitude(altitude) if the site has no barometer.
humidityRatio.returns=Humidity ratio, kg water per kg dry air.

humidityRatioFromDewPoint.desc=Humidity ratio from dew point.
humidityRatioFromDewPoint.param.dewPoint=Dew point over liquid water, \u00b0C.
humidityRatioFromDewPoint.param.pressure=Absolute pressure, Pa. Use pressureFromAltitude(altitude) if the site has no barometer.
humidityRatioFromDewPoint.returns=Humidity ratio, kg water per kg dry air.

relHumFromHumidityRatio.desc=Relative humidity from humidity ratio.
relHumFromHumidityRatio.param.dryBulb=Dry bulb temperature, \u00b0C.
relHumFromHumidityRatio.param.humidityRatio=Humidity ratio, kg water per kg dry air.
relHumFromHumidityRatio.param.pressure=Absolute pressure, Pa. Use pressureFromAltitude(altitude) if the site has no barometer.
relHumFromHumidityRatio.returns=Relative humidity, %.

absoluteHumidity.desc=Absolute humidity (water vapour density). Does not depend on pressure.
absoluteHumidity.param.dryBulb=Dry bulb temperature, \u00b0C.
absoluteHumidity.param.relHum=Relative humidity, % (0 to 100), relative to liquid water at all temperatures.
absoluteHumidity.returns=Absolute humidity, kg/m3.

wetBulb.desc=Thermodynamic wet bulb temperature (ASHRAE). Below 0 \u00b0C it is an ice bulb.
wetBulb.param.dryBulb=Dry bulb temperature, \u00b0C.
wetBulb.param.relHum=Relative humidity, % (0 to 100), relative to liquid water at all temperatures.
wetBulb.param.pressure=Absolute pressure, Pa. Use pressureFromAltitude(altitude) if the site has no barometer.
wetBulb.returns=Wet bulb temperature, \u00b0C.

relHumFromWetBulb.desc=Relative humidity from wet bulb temperature.
relHumFromWetBulb.param.dryBulb=Dry bulb temperature, \u00b0C.
relHumFromWetBulb.param.wetBulb=Wet bulb temperature, \u00b0C.
relHumFromWetBulb.param.pressure=Absolute pressure, Pa. Use pressureFromAltitude(altitude) if the site has no barometer.
relHumFromWetBulb.returns=Relative humidity, %.

enthalpy.desc=Moist air enthalpy, referenced to dry air and liquid water at 0 \u00b0C.
enthalpy.param.dryBulb=Dry bulb temperature, \u00b0C.
enthalpy.param.relHum=Relative humidity, % (0 to 100), relative to liquid water at all temperatures.
enthalpy.param.pressure=Absolute pressure, Pa. Use pressureFromAltitude(altitude) if the site has no barometer.
enthalpy.returns=Enthalpy, J per kg dry air.

specificVolume.desc=Moist air specific volume.
specificVolume.param.dryBulb=Dry bulb temperature, \u00b0C.
specificVolume.param.relHum=Relative humidity, % (0 to 100), relative to liquid water at all temperatures.
specificVolume.param.pressure=Absolute pressure, Pa. Use pressureFromAltitude(altitude) if the site has no barometer.
specificVolume.returns=Specific volume, m3 per kg dry air.

density.desc=Moist air density.
density.param.dryBulb=Dry bulb temperature, \u00b0C.
density.param.relHum=Relative humidity, % (0 to 100), relative to liquid water at all temperatures.
density.param.pressure=Absolute pressure, Pa. Use pressureFromAltitude(altitude) if the site has no barometer.
density.returns=Density, kg/m3.

pressureFromAltitude.desc=Standard atmosphere pressure at an altitude (ASHRAE).
pressureFromAltitude.param.altitude=Altitude above sea level, m (-1000 to 11000).
pressureFromAltitude.returns=Pressure, Pa.

state.desc=Every property of the air state in one call.
state.param.dryBulb=Dry bulb temperature, \u00b0C.
state.param.relHum=Relative humidity, % (0 to 100), relative to liquid water at all temperatures.
state.param.pressure=Absolute pressure, Pa. Use pressureFromAltitude(altitude) if the site has no barometer.
state.returns=Dictionary with dryBulb, relHum, pressure, dewPoint, frostPoint, wetBulb, humidityRatio, absoluteHumidity, vaporPressure, saturationPressure, vpd, enthalpy, specificVolume and density. dewPoint, frostPoint and wetBulb are None when outside the valid range.
